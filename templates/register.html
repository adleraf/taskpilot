<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🚀 Sign Up · TaskPilot</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

<div class="bg-orb bg-orb-1"></div>
<div class="bg-orb bg-orb-2"></div>
<div class="bg-orb bg-orb-3"></div>

<div class="container">

    <div class="brand-badge">✈️ TaskPilot</div>
    <h1>Join the crew 🚀</h1>
    <p class="subtitle">✨ Create your account and start shipping tasks.</p>

    {% with messages = get_flashed_messages(with_categories=true) %}
    {% if messages %}
        {% for category, message in messages %}
            <div class="flash {{ category }}">{{ message }}</div>
        {% endfor %}
    {% endif %}
    {% endwith %}

    <div class="glass-panel">
        <form method="POST">
            <input type="text" name="username" placeholder="👤 Username" required>
            <input type="email" name="email" placeholder="📧 Email address" required>
            <input type="password" name="password" placeholder="🔒 Password" required>
            <button type="submit" style="width: 100%; margin-top: 12px;">✨ Create Account</button>
        </form>
    </div>

    <p class="auth-footer">
        Already have an account? <a href="/login">Login here 🔐</a>
    </p>

</div>

</body>
</html>
