<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>✏️ Edit Task · TaskPilot</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

<div class="bg-orb bg-orb-1"></div>
<div class="bg-orb bg-orb-2"></div>
<div class="bg-orb bg-orb-3"></div>

<div class="container">

    <a href="/" class="back-link">← Back to dashboard</a>

    <div class="brand-badge">✏️ Edit Mode</div>
    <h1>Update your task ✏️</h1>
    <p class="subtitle">Make it perfect before you ship it. 🎯</p>

    <div class="glass-panel">
        <form method="POST">
            <input type="text" name="title" value="{{ task.title }}" placeholder="Task title..." required>
            <button type="submit" style="width: 100%; margin-top: 12px;">💾 Save Changes</button>
        </form>
    </div>

</div>

</body>
</html>
